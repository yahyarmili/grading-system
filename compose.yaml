# Development environment: Node runs in a container, no local Node install needed.
# Start: docker compose up   ->   http://localhost:3000
services:
  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    # Secrets (DATABASE_URL, DATABASE_URL_TEST…) for every command run in the
    # container: drizzle-kit and Vitest do not load .env.local themselves.
    # Recreate the container after editing it: docker compose up -d
    env_file:
      - path: .env.local
        required: false
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Hot reload: the Windows bind mount sends no file events, so both
      # watchers poll. Turbopack (file contents, see next.config.ts; lower =
      # faster reload, more CPU) and Watchpack (new or removed routes).
      NEXT_WATCH_POLL_MS: "1000"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

  # E2E journeys (Playwright, E1.6): docker compose run --rm e2e
  # Not started by "docker compose up". The image version must equal the
  # @playwright/test version of package.json. Own node_modules (glibc, not
  # Alpine) and own .next: the dev server above is left alone. Playwright
  # starts its own Next server on the test database (playwright.config.ts).
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    profiles: ["e2e"]
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"
    ipc: host
    env_file:
      - path: .env.local
        required: false
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules
      - e2e_next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
  e2e_node_modules:
  e2e_next_cache:
