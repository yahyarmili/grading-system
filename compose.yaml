# Development environment: Node runs in a container, no local Node install needed.
# Start: docker compose up   ->   http://localhost:3000
services:
  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Hot reload: the Windows bind mount sends no file events, so both
      # watchers poll. Turbopack (file contents, see next.config.ts; lower =
      # faster reload, more CPU) and Watchpack (new or removed routes).
      NEXT_WATCH_POLL_MS: "1000"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
